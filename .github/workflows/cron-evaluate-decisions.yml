name: Evaluation auto des decisions

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 0'

jobs:
  evaluate:
    name: Evaluer et recalibrer
    runs-on: ubuntu-latest
    steps:
      - name: Appeler API evaluation
        run: |
          HTTP_CODE=$(curl -s --max-time 300 -o response.json -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.SITE_URL }}/api/cron/evaluate-decisions")
          echo "HTTP status: $HTTP_CODE"
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "Echec: reponse non 2xx, le cron a echoue."
            cat response.json
            exit 1
          fi
